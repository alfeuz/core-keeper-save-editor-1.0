<app-card class="w-96 !grid grid-cols-2 gap-3">
  <label for="name">Charactername:</label>
  <input id="name" type="text" [value]="this.currentName" (change)="this.onNameChange($event)" />
  <label for="hardcore">Hardcore:</label>
  <input
    id="hardcore"
    type="checkbox"
    [(ngModel)]="this.isHardcore"
    (change)="this.onHardcoreChange($event)" />

  <label for="saveslot">Saveslot (index):</label>
  <input
    id="saveslot"
    type="number"
    [(ngModel)]="this.index"
    (change)="this.onIndexChange($event)" />
  <label for="souls">Enable Souls:</label>
  <input
    id="souls"
    type="checkbox"
    [(ngModel)]="this.hasSoulsUnlocked"
    (change)="this.onEnableSoulsChange($event)" />
  <ng-container *ngIf="this.hasSoulsUnlocked">
    <ng-container *ngFor="let soul of this.souls">
      <label [for]="'soul-' + soul.id" class="soul-label col-span-2">
        <img
          [src]="
            'assets/souls/' + soul.image + '_' + (this.collectedSouls.has(soul.id) ? 2 : 1) + '.png'
          "
          [alt]="'Soul of ' + soul.name" />
        <span>Soul of {{ soul.name }}</span>
        <input
          [id]="'soul-' + soul.id"
          type="checkbox"
          class="soul-checkbox"
          [ngModel]="this.collectedSouls.has(soul.id)"
          (change)="this.onSoulsChange($event, soul.id)" />
      </label>
    </ng-container>
  </ng-container>
  <div class="col-span-2">
    <button class="px-4 pb-2" (click)="this.resetCharacter()">Reset character</button>
  </div>
</app-card>
